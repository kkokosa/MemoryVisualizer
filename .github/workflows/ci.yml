name: Foundation, protocol, and snapshots

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - name: Install workspace dependencies
        run: npm ci
      - name: Typecheck workspace and check formatting
        run: npm run typecheck
      - run: npm run format:check
      - name: Restore pinned F# formatter
        run: dotnet tool restore
      - run: dotnet fantomas --check src tests
      - name: Restore locked packages
        run: dotnet restore MemoryVisualizer.slnx --locked-mode
      - name: Build
        run: dotnet build MemoryVisualizer.slnx -c Release --no-restore
      - name: Unit and generated offline-DAC snapshot integration tests
        run: dotnet test MemoryVisualizer.slnx -c Release --no-build --no-restore
        timeout-minutes: 10
      - name: Executable smoke tests
        run: npm run smoke
      - name: Shared contracts and native worker lifecycle
        run: npm run test:protocol
      - name: Build worker for host RID
        run: dotnet build src/MemoryVisualizer.Worker -c Release --no-restore -r ${{ matrix.rid }} --self-contained false
      - name: Build CLI for host RID
        run: dotnet build src/MemoryVisualizer.Cli -c Release --no-restore -r ${{ matrix.rid }} --self-contained false
      - name: RID executable smoke tests
        run: npm run smoke
        env:
          RUNTIME_IDENTIFIER: ${{ matrix.rid }}
      - name: RID worker lifecycle
        run: npm run test:protocol
        env:
          RUNTIME_IDENTIFIER: ${{ matrix.rid }}
      - name: Explicit pinned Electron runtime installation
        run: npm run electron:install
      - name: Linux Electron sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Real sandboxed Electron lifecycle (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron
        env:
          RUNTIME_IDENTIFIER: ${{ matrix.rid }}
      - name: Real sandboxed Electron lifecycle
        if: runner.os != 'Linux'
        run: npm run test:electron
        env:
          RUNTIME_IDENTIFIER: ${{ matrix.rid }}
